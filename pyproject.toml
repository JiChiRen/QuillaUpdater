[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quilla-updater"
version = "1.0.0"
description = "Host-side UART firmware upgrader for Quilla QBOOT boards"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
authors = [{ name = "JiChiRen Info. Tech." }]
keywords = ["quilla", "qboot", "firmware", "uart", "serial", "upgrade", "ed25519"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = ["pyserial>=3.4"]

[project.optional-dependencies]
# Only needed to freeze a single-file executable; not required to run.
build = ["pyinstaller>=6.0"]

[project.scripts]
quflash = "quilla_updater.cli:main"
quflash-gui = "quilla_updater.gui:main"

[project.urls]
Homepage = "https://github.com/JiChiRen/QuillaUpdater"
Repository = "https://github.com/JiChiRen/QuillaUpdater"
Issues = "https://github.com/JiChiRen/QuillaUpdater/issues"
Changelog = "https://github.com/JiChiRen/QuillaUpdater/releases"

[tool.setuptools]
packages = ["quilla_updater"]
